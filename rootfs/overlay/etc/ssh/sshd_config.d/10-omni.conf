# /etc/ssh/sshd_config.d/10-omni.conf -- Avast Omni.
#
# Included by Debian's /etc/ssh/sshd_config via `Include /etc/ssh/sshd_config.d/*.conf`
# on the FIRST line, and sshd takes the first value it sees for most keywords --
# so this drop-in wins over the packaged defaults.
#
# Policy, per the migration plan: HARDEN SSH, DO NOT HARDEN THE SERIAL CONSOLE.
# The console keeps passwordless root (see
# /etc/systemd/system/serial-getty@ttyAML0.service.d/autologin.conf) because it
# is the last way into a headless box in a closet.  SSH, which is exposed to the
# network, gets keys only.

# --- Authentication ---------------------------------------------------------
# Key-based root login only.  Debian's default is already prohibit-password;
# stated explicitly so a package default change cannot lock us out or open us up.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no

# Authorized keys from BOTH the per-slot image location and the shared /data
# partition.  The /data path is what makes SSH access survive an A/B flip
# without symlinking /root/.ssh (a dangling symlink when /data fails to mount
# would cost you the only network login).  sshd silently skips a path that does
# not exist, so an unmounted /data degrades to image-only keys instead of
# failing.  /data/ssh must be 0700 root:root -- see /etc/tmpfiles.d/omni-data.conf.
AuthorizedKeysFile .ssh/authorized_keys /data/ssh/authorized_keys

# --- Host keys --------------------------------------------------------------
# /data first so the fingerprint is stable across a slot flip; /etc as fallback
# so sshd still starts on a box whose /data is missing or empty.  sshd warns
# about an unloadable HostKey but starts as long as at least one loads, and
# omni-ssh-hostkeys.service seeds the /data pair before ssh.service starts.
HostKey /data/ssh/ssh_host_ed25519_key
HostKey /data/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# --- Keepalives -------------------------------------------------------------
# A router reboots its own uplink; make dead sessions go away instead of
# accumulating on a 512 MB box.
ClientAliveInterval 30
ClientAliveCountMax 4
TCPKeepAlive yes

# --- Reduce the attack surface and the memory footprint ---------------------
UseDNS no
X11Forwarding no
AllowAgentForwarding no
PrintMotd no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30

# Do not enable AllowTcpForwarding=no without checking: it is how you tunnel to
# a service on the box when only SSH is reachable, which during migration is
# often the only thing that works.
AllowTcpForwarding yes
