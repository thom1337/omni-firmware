#
# /etc/initramfs-tools/initramfs.conf -- Avast Omni (Debian trixie, arm64).
# See initramfs.conf(5).  Values here can be overridden by files in
# /etc/initramfs-tools/conf.d/, which are sourced AFTER this file both by
# mkinitramfs (build time) and by /init (boot time).
#
# ###########################################################################
# ## READ THIS BEFORE ADDING ROOTFSTYPE HERE                               ##
# ##                                                                       ##
# ## ROOTFSTYPE is NOT an initramfs.conf(5) variable.  It is a /init        ##
# ## runtime variable, exported empty at /init:62 and normally filled from  ##
# ## the `rootfstype=` kernel command-line parameter at /init:116.  It      ##
# ## happens to work if set here, because /init sources /conf/initramfs.conf##
# ## before it parses /proc/cmdline -- but that is an undocumented side     ##
# ## effect of a dpkg *conffile* that initramfs-tools upgrades will prompt  ##
# ## about.  The documented, upgrade-safe home for runtime variables is     ##
# ## /etc/initramfs-tools/conf.d/, so ROOTFSTYPE lives in                   ##
# ##     /etc/initramfs-tools/conf.d/zz-omni-root                           ##
# ## (named zz-* so it sorts last and wins over conf.d/resume et al).       ##
# ##                                                                       ##
# ## We cannot pass rootfstype= on the command line: the stored U-Boot      ##
# ## CONFIG_BOOTARGS is "rootwait rw console=ttyAML0" and MENDER_BOOTARGS   ##
# ## prepends root=; changing it means touching the bootloader environment, ##
# ## which this migration deliberately never does.                          ##
# ###########################################################################

#
# MODULES: [ most | netboot | dep | list ]
#
# list -- ONLY the modules named in /etc/initramfs-tools/modules (plus their
# dependencies) are copied in.
#
# `dep` is forbidden here: it inspects the *build host's* /sys and /proc to
# guess what is needed.  The image is built in an x86_64 mmdebstrap/qemu chroot,
# so `dep` would produce an initramfs for the builder, not for a meson-axg box.
# `most` would work but drags in ~20 MB of drivers for a 512 MB device whose
# root is always the same eMMC controller.
#
MODULES=list

#
# BUSYBOX: [ y | n | auto ]
#
# Explicitly y, not auto.  The whole panic-handling design of
# scripts/local-bottom/omni-overlay depends on there being a real shell on
# ttyAML0 when something goes wrong; `auto` silently degrades to klibc (no awk,
# no grep, no interactive shell worth the name) if busybox is not installed.
# The image must therefore install the `busybox` package (Debian; Ubuntu calls
# the equivalent busybox-initramfs) -- it is in rootfs/packages.list, and CI
# should assert both the package and BUSYBOX=y here.
#
BUSYBOX=y

#
# COMPRESS: [ gzip | bzip2 | lz4 | lzma | lzop | xz | zstd ]
#
# gzip, not Debian's default zstd.  U-Boot 2018.09 loads this file as a raw
# ramdisk and the KERNEL decompresses it; CONFIG_RD_ZSTD is not something we are
# going to bet an unattended slot on, and gzip is the format the existing
# apollo-initramfs-image-*.cpio.gz name already implies.  Decompression cost at
# this size is a few hundred milliseconds.
#
COMPRESS=gzip
COMPRESSLEVEL=9

#
# DEVICE: network interface for netboot.  Unused -- root is always eMMC.
#
DEVICE=

#
# NFSROOT: [ auto | HOST:MOUNT ].  Never NFS on this box.
#
NFSROOT=no

#
# RUNSIZE: size of the /run tmpfs the initramfs creates.  /init later moves this
# very mount into the real root, so it becomes the system's /run for the whole
# uptime.  10% of 512 MB = 51 MB, which is more than a headless router needs and
# is memory it can never get back.
#
RUNSIZE=32M

#
# FSTYPE: build-time only.  /usr/share/initramfs-tools/hooks/fsck consults it
# (and, when it is `auto`, the BUILD HOST's /etc/fstab) to decide which
# fsck.<type> helper to copy in.  Our /etc/fstab deliberately has no "/" line
# because the root filesystem is an overlay assembled in the initramfs, so
# `auto` would find nothing and ship no fsck at all -- and scripts/local's
# checkfs() would then never be able to repair a slot.  Name it explicitly.
#
FSTYPE=ext4

#
# RESUME: no swap, no hibernation anywhere on this device.  `none` stops
# initramfs-tools looking for a resume device and stops it emitting a warning on
# every update-initramfs run.  Also repeated in conf.d/zz-omni-root so that a
# Debian-generated conf.d/resume cannot override it (conf.d sorts after this
# file, and "zz-omni-root" sorts after "resume").
#
RESUME=none

#
# KEYMAP: no keyboard.  Console is ttyAML0 at 115200 8N1.
#
KEYMAP=n
