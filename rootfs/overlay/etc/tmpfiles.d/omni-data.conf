# /etc/tmpfiles.d/omni-data.conf -- directory layout on /data (p3).
#
# Runs from systemd-tmpfiles-setup.service, which is ordered After=local-fs.target,
# so /data is already mounted by then.  If /data failed to mount (it is nofail in
# /etc/fstab, deliberately), these directories get created in the overlay upper
# instead -- harmless, and hidden again the moment a healthy /data mounts.
#
# Nothing here is A/B protected.  See rootfs/overlay/README.md.
#
# Type Path                Mode UID  GID  Age Argument

# The mount point itself, so a failed /data mount still yields a sane tree.
d /data                    0755 root root -

# sshd host keys + authorized_keys, referenced by
# /etc/ssh/sshd_config.d/10-omni.conf.  sshd refuses to use an authorized_keys
# file reachable through a group- or world-writable directory, so 0700 is a
# functional requirement, not paranoia.
d /data/ssh                0700 root root -

# Container storage.  Docker's data-root (/etc/docker/daemon.json) and
# containerd's root (/etc/containerd/config.toml).  Both daemons fix up their
# own subdirectory permissions on first start; 0711 matches what they create.
d /data/docker             0711 root root -
d /data/containerd         0711 root root -

# Optional persistent log target.  Empty unless someone bind-mounts it over
# /var/log (the commented alternative in /etc/fstab).
d /data/log                0755 root root -

# Room for application state that must outlive a slot flip.  Deliberately NOT
# used for anything in the base image: every path added here is a path that
# silently survives a rollback.
d /data/lib                0755 root root -
