# /etc/containerd/config.toml -- Avast Omni.
#
# Debian's docker.io / docker-ce uses the SYSTEM containerd (containerd.service,
# socket /run/containerd/containerd.sock), so relocating Docker's data-root in
# /etc/docker/daemon.json is only half the job: image layers and container
# snapshots actually live under containerd's `root`.  Leave it at the default
# /var/lib/containerd and every pulled image lands in the overlay upper (p5/p6),
# which the flasher wipes before each slot write and which is far too small.
#
# See the /data relocation table in rootfs/overlay/README.md.
#
# `version = 2` is the containerd 1.7 config schema shipped by Debian trixie.
# On containerd 2.x this becomes `version = 3`; `root` and `state` are top-level
# in both, so only the version line needs revisiting.
version = 2

# Persistent state -> /data (p3), shared across both A/B slots and NOT protected
# by a rollback.  This is a deliberate trade: container images are large, mostly
# immutable, and re-pulling them after every slot flip would be worse.
root = "/data/containerd"

# Runtime state stays on tmpfs.  It must NOT go to /data: stale sockets and
# bundle state from a previous boot are how containerd wedges on startup.
state = "/run/containerd"

# The unix socket docker connects to.  Stated explicitly so a distro default
# change cannot silently break the pairing with /etc/docker/daemon.json.
[grpc]
  address = "/run/containerd/containerd.sock"

[debug]
  level = "warn"

# NOTE: there is deliberately no [plugins."io.containerd.grpc.v1.cri"] section.
# Docker does not go through containerd's CRI plugin -- it drives containerd's
# core services directly and passes the runc cgroup driver itself, via
# "exec-opts": ["native.cgroupdriver=systemd"] in /etc/docker/daemon.json.
# Setting systemd_cgroup / SystemdCgroup here would configure a code path this
# box never executes, and getting the (version-dependent) key wrong is a silent
# no-op at best.  If Kubernetes ever runs here, revisit -- and then the two
# drivers MUST agree or container limits are silently ignored.
