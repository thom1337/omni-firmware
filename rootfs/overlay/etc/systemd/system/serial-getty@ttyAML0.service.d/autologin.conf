# /etc/systemd/system/serial-getty@ttyAML0.service.d/autologin.conf
#
# PASSWORDLESS ROOT ON THE SERIAL CONSOLE.  THIS IS DELIBERATE.
#
# The Yocto firmware has it today:
#   repo/meta-apollo/recipes-core/systemd-apollo/systemd-serialgetty/access.conf
#       [Service]
#       Environment="ACCESS=-aroot"
#   ...spliced into agetty's command line by systemd-serialgetty.bbappend.
#
# Losing it during the migration is not a hardening win, it is a brick:
#   * SSH needs an address, which needs DHCP or a working fallback;
#   * the U-Boot "=>" prompt needs bootdelay >= 0, and a field unit ships
#     bootdelay=-2;
#   * the box is headless, in a closet, with no BMC and no remote power.
# If the network does not come up, this console is the ONLY way in.  Harden SSH
# instead (see /etc/ssh/sshd_config.d/10-omni.conf); do not harden this.
#
# Assert it in CI:
#   systemd-analyze --root "$ROOTDIR" cat-config \
#       systemd/system/serial-getty@ttyAML0.service | grep -q -- '--autologin root'
#
# The unit is normally instantiated automatically by systemd-getty-generator,
# because the kernel command line carries console=ttyAML0 (U-Boot
# CONFIG_BOOTARGS="rootwait rw console=ttyAML0").  A static enablement symlink
# is shipped as well, in
#   /etc/systemd/system/getty.target.wants/serial-getty@ttyAML0.service
# so that a console= change cannot silently take the console away.

[Service]
# Clear the packaged ExecStart before replacing it -- systemd appends otherwise
# and a Type=oneshot-style double-exec is not what we want.
ExecStart=
# --autologin root  : agetty runs `login -f root`, no password prompt.
# --noclear         : do not send the terminal-clear escape to a serial line.
# --keep-baud       : honour whatever the console is actually running at; the
#                     115200 8N1 first entry matches U-Boot's console setup, and
#                     the fallbacks let a mis-set adapter still find sync.
# %I                : the instance name (ttyAML0) -- explicit rather than the
#                     packaged "-" form, so this drop-in is self-contained.
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I $TERM

# Restart the getty forever: a serial console that dies once and stays dead has
# exactly the same operational consequence as never having existed.
Restart=always
RestartSec=1s

# Do not let a hung login block a shutdown.
TimeoutStopSec=30s
