# /etc/systemd/system.conf.d/10-omni-watchdog.conf
#
# Carries the Yocto system's hardware watchdog forward.  Debian defaults it OFF.
#
# Source of truth for the old value:
#   repo/meta-apollo/recipes-core/systemd-apollo/files/system.conf:27
#       RuntimeWatchdogSec=10
#   repo/meta-apollo/recipes-kernel/linux/files/defconfig:237-238
#       (MESON_GXBB_WATCHDOG enabled)
# The Armbian kernel config delta must set CONFIG_MESON_GXBB_WATCHDOG=y --
# Armbian ships it =m, and a watchdog whose module has not been loaded yet is a
# watchdog that is not running during the exact window it is needed.
#
# ###########################################################################
# ##  DO NOT SHIP THIS ENABLED UNTIL PRE-FLIGHT CHECK P5 IS ANSWERED.       ##
# ##                                                                        ##
# ##  On this board a WATCHDOG RESET DOES NOT GO TO THE OTHER A/B SLOT.     ##
# ##  U-Boot's                                                              ##
# ##      check_watchdog=itest.w *0xff80023c -eq 0xd000                     ##
# ##  (patch 0044) forces mender_boot_part=7 -- RECOVERY -- and it runs      ##
# ##  BEFORE slot selection.  Worse, altbootcmd ends in `run bootcmd`        ##
# ##  (patch 0029:157), which re-evaluates check_watchdog, so a LATCHED     ##
# ##  0xd000 traps every subsequent boot in recovery and the bootcount      ##
# ##  rollback can never escape it.  If p7 is empty (check P6), that is a   ##
# ##  brick recoverable only over serial.                                   ##
# ##                                                                        ##
# ##  P5 must establish what actually sets 0xff80023c to 0xd000, across:    ##
# ##  cold power-on, `reset` at the "=>" prompt, a Linux `reboot`, a forced ##
# ##  watchdog bite, and a cold power cut.  Only if a plain reboot and a    ##
# ##  power cut do NOT latch it is this file safe to enable.                ##
# ##                                                                        ##
# ##  During any migration step, also neutralise the U-Boot side:           ##
# ##      fw_setenv check_watchdog "false"                                  ##
# ##  and disable the watchdog outright around a slot flash -- a 400 MB     ##
# ##  write on a 512 MB box can starve PID 1 past its 10 s ping.            ##
# ###########################################################################

[Manager]
# PID 1 pings /dev/watchdog every RuntimeWatchdogSec/2 seconds.  Ten seconds
# matches the Yocto value exactly; do not "improve" it without re-running P5,
# because the safe value is a function of where the reset lands, not of taste.
RuntimeWatchdogSec=10

# Explicit device, so a second watchdog appearing later (some Amlogic SoCs
# expose more than one) cannot silently move the one PID 1 is feeding.
WatchdogDevice=/dev/watchdog

# Watchdog during shutdown/reboot.  Trade-off, stated plainly:
#   ON  -> a hang during shutdown eventually resets the box, but the reset is a
#          WATCHDOG reset, so it lands in p7 recovery, not in the other slot.
#   OFF -> a hang during shutdown is permanent until someone pulls the plug.
# For a box in a closet, "eventually resets into recovery" beats "never resets",
# so this stays on -- but it is the reason P6 (is p7 populated and bootable?)
# is a hard gate.
RebootWatchdogSec=5min

# Do not arm the watchdog for kexec; we never kexec on this platform.
KExecWatchdogSec=off
