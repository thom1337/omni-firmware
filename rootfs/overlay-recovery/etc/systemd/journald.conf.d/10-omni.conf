# /etc/systemd/journald.conf.d/10-omni.conf -- bound the journal on a 512 MB box.
#
# Replaces repo/meta-apollo/recipes-core/systemd-apollo/files/journald.conf
# (Storage=none, RuntimeMaxUse=64M, ForwardToSyslog=yes).
#
# Storage=volatile, not none: the journal is the only structured record of why a
# slot failed to commit, and /run is tmpfs so it costs no eMMC writes and no
# overlay-upper space.  It is lost on reboot -- which is fine, because the
# console mirror below is what you actually read after a bad boot.

[Journal]
# Never write to /var/log/journal.  /var/log is a 64 MB tmpfs (see /etc/fstab)
# and anything under / is overlay-upper space on p5/p6.
Storage=volatile

# Default RuntimeMaxUse is 10% of /run, and /run is RUNSIZE=32M from the
# initramfs -- but state that explicitly rather than inheriting an arithmetic.
RuntimeMaxUse=16M
RuntimeKeepFree=8M
RuntimeMaxFileSize=4M

# Mirror warnings and worse to ttyAML0.  On a headless box the serial console is
# the recovery channel; a boot that fails before sshd is up leaves nothing else.
ForwardToConsole=yes
MaxLevelConsole=warning
TTYPath=/dev/ttyAML0

# No syslog daemon in the image (syslog-ng is a Yocto-ism that is not carried
# forward); do not spend cycles forwarding to a socket nobody reads.
ForwardToSyslog=no
ForwardToWall=no

# Rate limiting: a wedged service logging in a tight loop must not push the boot
# messages out of a 16 MB ring before anyone can read them.
RateLimitIntervalSec=30s
RateLimitBurst=1000

# No compression or sealing: both cost CPU on a Cortex-A53 for a ring buffer
# that never leaves RAM.
Compress=no
Seal=no
