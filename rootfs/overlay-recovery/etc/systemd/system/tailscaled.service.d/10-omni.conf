# Omni overrides for tailscaled.
#
# THE STATE FILE IS THE WHOLE POINT OF THIS DROP-IN.
#
# tailscaled defaults its state to /var/lib/tailscale/tailscaled.state. On this
# box /var is part of the root overlay, so that path lands in the PER-SLOT
# overlay upper (p5 for slot A, p6 for slot B). The node identity would then be
# tied to whichever slot happened to write it, and the first A/B flip would boot
# a slot whose upper has never seen Tailscale -- the device would drop off the
# tailnet and need re-authenticating, on a headless unit, after every update.
# That is exactly the per-slot-state trap docs/ARMBIAN-MIGRATION.md warns about
# for sshd host keys, and it has the same fix: move it to /data (p3), the only
# partition shared by both slots.
#
# Nothing in /data is A/B protected -- a bad state file there survives a
# rollback. That is the accepted trade for keeping one machine identity.
[Unit]
# /data is nofail in fstab, so it can legitimately be absent. Without this,
# tailscaled starts anyway and quietly writes state somewhere that vanishes.
RequiresMountsFor=/data

[Service]
Environment=
# --statedir rather than --state: tailscaled keeps more than one file here
# (certs, derpmap cache), and pointing only the state file at /data would leave
# the rest per-slot again.
ExecStart=
ExecStart=/usr/sbin/tailscaled \
    --state=/data/tailscale/tailscaled.state \
    --socket=/run/tailscale/tailscaled.sock \
    --port=${PORT} \
    $FLAGS

# The default unit ships StateDirectory=tailscale, which would recreate
# /var/lib/tailscale and re-introduce the per-slot path. Clear it.
StateDirectory=

Restart=on-failure
RestartSec=5s
