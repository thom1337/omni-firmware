# The real locale file on Debian trixie. /etc/default/locale is a SYMLINK to
# this ("../locale.conf"), created by the base system -- and mmdebstrap
# --variant=important leaves that symlink DANGLING because it never installs
# the locales package. A dangling target is exactly what made PAM print
#   pam_env(login:session): Unable to open env file: /etc/default/locale
# on every serial and SSH login. Shipping both paths means the warning stays
# gone whether a consumer follows the symlink (pam_env, login) or reads
# /etc/locale.conf directly (systemd, localectl).
#
# C.UTF-8 is built into glibc and needs no locale generation, which suits an
# appliance: correct UTF-8 handling for the login banner's box-drawing
# characters without carrying locale data in both A/B slots.
LANG=C.UTF-8
LC_ALL=C.UTF-8
