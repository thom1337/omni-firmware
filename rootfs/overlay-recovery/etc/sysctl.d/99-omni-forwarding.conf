# IP forwarding, for Tailscale subnet routing and exit-node use.
#
# THIS FILE IS IN THE RECOVERY OVERLAY TOO, AND THAT IS NOT REDUNDANT.
# Tailscale's state -- including which routes this node advertises and whether
# it offers itself as an exit node -- lives in /data/tailscale/tailscaled.state,
# which p7 SHARES with both A/B slots. So a recovery boot re-advertises the
# subnet route and the exit node automatically, using the same node identity,
# and the control plane still has them approved.
#
# Without this file in recovery, that combination fails in the worst possible
# way: the tailnet believes the Omni is the primary router for the LAN, and it
# black-holes every packet, silently, at exactly the moment someone is already
# troubleshooting the box. Recovery has to be able to serve what it advertises.
#
# Without these the box will happily advertise routes and an exit node, the
# admin console will happily show them approved, and traffic will silently go
# nowhere -- the kernel drops anything not addressed to it. It is a quiet
# failure with no error anywhere, which is why it is shipped rather than left
# as a step in a runbook.
#
# This makes the Omni a router. That is what it was built to be -- it shipped as
# an inline home-network security appliance -- but it is worth being deliberate
# about: with these on, the box forwards between every network it can see,
# including between the DHCP LAN and the 192.168.77.0/24 rescue address in
# 20-eth.network. On a single-NIC box on a trusted LAN that is harmless; on a
# box with a second interface facing anything untrusted it would not be, and
# you would want an nftables forward policy to go with it.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
